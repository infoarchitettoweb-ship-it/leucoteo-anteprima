<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M48 13 A43 43 0 0 0 48 99 Z' fill='%23FFB020'/%3E%3Cpath d='M52 1 A43 43 0 0 1 52 87 Z' fill='%233AE7CD'/%3E%3C/svg%3E">
<style>
/* ============================================================
   LEUCOTEO · il guscio dell'app
   Tre forme, una per contesto d'uso:
   desktop  → fianco disteso, richiudibile a colonna di icone
   tablet   → fianco già a icone, si apre al passaggio
   telefono → dock flottante, il pollice arriva dappertutto
   ============================================================ */
body{background:var(--fondo)}
.tela{display:grid;grid-template-columns:var(--fianco) 1fr;min-height:100vh;min-height:100dvh;
  transition:grid-template-columns .42s var(--e-std)}
body[data-fianco="chiuso"] .tela{grid-template-columns:var(--fianco-min) 1fr}

/* la luce di fondo la mette la scena, in stile.css: qui si toglie
   per non sommare due strati dello stesso colore */

/* ------------------------------------------------------------
   IL FIANCO
   ------------------------------------------------------------ */
/* Il fianco è una card che galleggia sopra la scena: staccata dai bordi
   su tutti e quattro i lati, angoli tondi, ombra sua. Non è un pannello
   attaccato al lato della finestra. */
.fianco{
  position:sticky;top:var(--fianco-orlo);
  height:calc(100dvh - var(--fianco-orlo) * 2);
  margin:var(--fianco-orlo);
  z-index:var(--z-fianco);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.016)),
             rgba(13,15,16,.86);
  border:1px solid var(--bo);border-radius:26px;
  box-shadow:var(--om-3), var(--filo);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  display:flex;flex-direction:column;padding:18px 14px;gap:14px;overflow:visible;
  transition:border-radius .42s var(--e-std);
}
.fianco .alto{display:flex;align-items:center;gap:8px;padding:4px 6px 0;min-height:34px}
.fianco .marchio{display:flex;align-items:center;min-width:0}
.fianco .marchio .marchio-w{font-size:19px;white-space:nowrap}
.fianco .marchio .o{width:.62em;height:.62em}

/* Il logotipo si ritira sul segno: chiudendo il fianco restano le due
   metà, che sono il marchio vero. La parola torna riaprendo. */
.marchio .coda{display:inline-block;max-width:6em;overflow:hidden;vertical-align:bottom;
  transition:max-width .38s var(--e-std),opacity .22s var(--e-std)}
body[data-fianco="chiuso"] .marchio .coda{max-width:0;opacity:0}
body[data-fianco="chiuso"] .fianco .marchio{margin:0 auto}
body[data-fianco="chiuso"] .fianco .marchio .marchio-w{font-size:22px}

/* Il tasto sta a cavallo del bordo, come una linguetta della card */
.piega{position:absolute;right:-14px;top:22px;width:28px;height:28px;border-radius:9px;
  display:grid;place-items:center;color:var(--gri-3);flex:none;z-index:6;
  background:var(--su-3);
  box-shadow:inset 0 0 0 1px var(--bo-2), 0 4px 12px rgba(0,0,0,.5);
  transition:color .2s var(--e-std),background-color .2s var(--e-std),
             box-shadow .2s var(--e-std),transform .2s var(--e-molla)}
.piega:hover{color:var(--bia);background:#22262a;box-shadow:inset 0 0 0 1px var(--bo-3), 0 6px 16px rgba(0,0,0,.55)}
.piega:active{transform:scale(.92)}
.piega .ico{width:15px;height:15px}
/* la colonnina si riempie quando il fianco è aperto: il segno dice in che
   stato sei, senza girare su sé stesso */
.piega .riempi{fill:currentColor;opacity:.9;transition:opacity .3s var(--e-std)}
body[data-fianco="chiuso"] .piega .riempi{opacity:0}

/* l'azione principale sta in cima, dove si guarda per prima */
.prima-azione{display:flex;align-items:center;gap:11px;width:100%;
  background:linear-gradient(180deg,var(--acc-hi),var(--acc));color:var(--su-acc);
  border-radius:var(--r-p);padding:11px 16px;min-height:46px;font-weight:600;font-size:14.5px;
  box-shadow:0 6px 18px rgba(var(--acc-rgb),.22), inset 0 1px 0 rgba(255,255,255,.24);
  white-space:nowrap;overflow:hidden}
.prima-azione .pi{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.34)}
.prima-azione .et{transition:max-width .38s var(--e-std),opacity .22s var(--e-std);
  max-width:11em;overflow:hidden}
body[data-fianco="chiuso"] .prima-azione{padding:11px;justify-content:center}
body[data-fianco="chiuso"] .prima-azione .et{max-width:0;opacity:0}

/* ------------------------------------------------------------
   IL SEGNALE DI RICERCA
   Sta dove stava lo scambio di lato: è il primo interruttore che
   si vede, perché è quello che decide se esisti nei risultati.
   Acceso ha una spia viva; spento è una riga qualunque.
   ------------------------------------------------------------ */
.cerca-stato{background:var(--velo);border-radius:var(--r-2);padding:11px 13px;
  box-shadow:inset 0 0 0 1px var(--bo);
  transition:background-color var(--t-tocco) var(--e-std),box-shadow var(--t-tocco) var(--e-std)}
.cerca-stato.acceso{background:rgba(var(--acc-rgb),.08);
  box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.32)}
.cerca-stato .t{display:block;font-size:13.5px;font-weight:600;color:var(--gri-2);line-height:1.3}
.cerca-stato.acceso .t{color:var(--bia)}
.cerca-stato .d{display:block;font-size:11.5px;color:var(--gri-3);margin-top:3px;line-height:1.35}

/* la spia: ferma quando è spenta, con un alone che respira quando è viva */
.cerca-stato .spia{width:8px;height:8px;border-radius:50%;flex:none;background:var(--bo-2);
  transition:background-color .3s var(--e-std),box-shadow .3s var(--e-std)}
.cerca-stato.acceso .spia{background:var(--acc);box-shadow:0 0 0 0 rgba(var(--acc-rgb),.5);
  animation:respiro 2.6s var(--e-std) infinite}
@keyframes respiro{
  0%,100%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.45)}
  50%{box-shadow:0 0 0 5px rgba(var(--acc-rgb),0)}
}

/* l'interruttore: una pallina che scorre, non due stati che si scambiano */
.interruttore{width:40px;height:23px;border-radius:var(--r-p);flex:none;position:relative;
  background:var(--su-3);box-shadow:inset 0 0 0 1px var(--bo-2);
  transition:background-color .3s var(--e-std),box-shadow .3s var(--e-std)}
.interruttore[aria-checked="true"]{background:linear-gradient(180deg,var(--acc-hi),var(--acc));
  box-shadow:0 2px 8px rgba(var(--acc-rgb),.28), inset 0 1px 0 rgba(255,255,255,.24)}
.interruttore .pallina{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
  background:var(--gri-3);box-shadow:0 1px 3px rgba(0,0,0,.4);
  transition:transform .42s var(--e-molla),background-color .3s var(--e-std)}
.interruttore[aria-checked="true"] .pallina{transform:translateX(17px);background:var(--su-acc)}
.interruttore:active .pallina{transform:scale(.88)}
.interruttore[aria-checked="true"]:active .pallina{transform:translateX(17px) scale(.88)}
body[data-fianco="chiuso"] .fianco #cerca{display:none}

/* ------------------------------------------------------------
   LA BARRA DEI FILTRI
   Tre gruppi separati da una linea: «ordina per» e «mostra solo»
   non sono la stessa domanda, e messi in fila sembravano una
   sola riga di pastiglie intercambiabili.
   ------------------------------------------------------------ */
.barra-filtri{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.gruppo-filtri{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gruppo-filtri > .uc{flex:none}
.barra-filtri .divisore{width:1px;height:22px;background:var(--bo-2);flex:none}
@media (max-width:860px){
  .barra-filtri{gap:12px}
  .barra-filtri .divisore{display:none}
  .gruppo-filtri{width:100%}
}

.menu{display:flex;flex-direction:column;gap:2px;margin-top:2px;position:relative}
/* Un solo oggetto che si sposta, come nel dock: la pastiglia scivola
   verso la voce scelta invece di spegnersi qui e accendersi là. */
.menu::before{content:"";position:absolute;left:0;right:0;top:0;z-index:0;pointer-events:none;
  height:var(--pill-h,44px);border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.042));
  box-shadow:0 6px 16px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.13),
             inset 0 0 0 1px rgba(255,255,255,.05);
  opacity:var(--pill-o,0);
  /* Si muove con transform, non con top: è l'unica proprietà che il
     browser sposta senza rifare il layout, e una transizione su top che
     dipende da una variabile non registrata non parte nemmeno. */
  transform:translate3d(0,var(--pill-y,0px),0);
  transition:transform .5s var(--e-molla),height .3s var(--e-std),opacity .3s var(--e-std)}
.menu button{position:relative;z-index:1}
.menu button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-2);
  font-size:14.5px;font-weight:450;color:var(--gri-2);text-align:left;width:100%;position:relative;
  min-height:44px;white-space:nowrap;
  transition:color var(--t-tocco) var(--e-std),background-color var(--t-tocco) var(--e-std)}
.menu button:hover{color:var(--bia);background:var(--velo)}
/* La voce attiva è una superficie sollevata dentro la card, non un
   fondo colorato: è la stessa idea del riferimento, tradotta sul scuro. */
.menu button[aria-current="page"]{color:var(--bia);font-weight:600}
.menu button[aria-current="page"] .cont{background:var(--acc);color:var(--su-acc)}
.menu .ic{display:grid;place-items:center;color:var(--gri-3);flex:none;
  transition:color var(--t-tocco) var(--e-std),transform var(--t-tocco) var(--e-molla)}
.menu button:hover .ic{color:var(--gri-2)}
.menu button:active .ic{transform:scale(.88)}
.menu button[aria-current="page"] .ic{color:var(--acc)}
.menu .et{transition:max-width .38s var(--e-std),opacity .22s var(--e-std);max-width:12em;overflow:hidden}
.menu .cont{margin-left:auto;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--acc);color:var(--su-acc);border-radius:var(--r-p);padding:2px 8px;line-height:1.5;
  transition:opacity .22s var(--e-std)}

/* fianco chiuso: solo icone, l'etichetta torna come suggerimento */
body[data-fianco="chiuso"] .fianco{padding:18px 9px}
body[data-fianco="chiuso"] .menu button,
body[data-fianco="chiuso"] .chi{justify-content:center;padding-left:0;padding-right:0}
body[data-fianco="chiuso"] .prima-azione,
body[data-fianco="chiuso"] .chi,
body[data-fianco="chiuso"] .menu button{gap:0}
body[data-fianco="chiuso"] .menu .et{max-width:0;opacity:0}
body[data-fianco="chiuso"] .menu .cont{position:absolute;top:5px;right:9px;margin:0;
  min-width:17px;padding:0 5px;text-align:center}
/* a fianco chiuso la voce attiva è un riquadro pieno, non una barra
   che sborda: la barra ha senso solo accanto a un'etichetta */
body[data-fianco="chiuso"] .menu button[aria-current="page"]::before{display:none}
body[data-fianco="chiuso"] .menu button{width:48px;height:48px;min-height:48px;
  margin:0 auto;padding:0;justify-content:center;gap:0}
body[data-fianco="chiuso"] .menu .cont{top:1px;right:1px}
body[data-fianco="chiuso"] .prima-azione{width:48px;height:48px;min-height:48px;
  margin:0 auto;padding:0;border-radius:50%}
/* il menu è largo quanto un pulsante, così la pastiglia — che è larga
   quanto il menu — ci va sopra esatta invece di sbordare di 4 px */
body[data-fianco="chiuso"] .menu{width:48px;margin-left:auto;margin-right:auto}
body[data-fianco="chiuso"] .fianco .alto{justify-content:center;padding:0}
body[data-fianco="chiuso"] .chi{justify-content:center;padding:14px 0 4px}
.menu button .sugg{position:absolute;left:calc(100% + 12px);top:50%;transform:translate(-6px,-50%) scale(.96);
  background:var(--su-3);color:var(--bia);font-size:13px;font-weight:500;padding:7px 12px;
  border-radius:var(--r-1);box-shadow:var(--om-3);white-space:nowrap;pointer-events:none;
  opacity:0;visibility:hidden;z-index:5;
  transition:opacity .18s var(--e-std),transform .24s var(--e-molla),visibility .18s}
body[data-fianco="chiuso"] .menu button:hover .sugg{opacity:1;visibility:visible;transform:translate(0,-50%) scale(1)}

.chi{margin-top:auto;display:flex;align-items:center;gap:11px;padding:14px 10px 4px;
  border-top:1px solid var(--bo);min-width:0}
.chi .ava{width:34px;height:34px;flex:none}
.chi .testo{min-width:0;transition:max-width .38s var(--e-std),opacity .22s var(--e-std);
  max-width:12em;overflow:hidden}
body[data-fianco="chiuso"] .chi .testo{max-width:0;opacity:0}
.chi .n{font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chi .r{font-size:12.5px;color:var(--gri-3);white-space:nowrap}

/* ------------------------------------------------------------
   IL CORPO
   ------------------------------------------------------------ */
.corpo{min-width:0;position:relative;display:flex;flex-direction:column;z-index:1}
/* La testata scorre via col contenuto: non è ancorata allo schermo.
   Ancorata serviva un velo per coprire il testo che le passava sotto, e
   quel velo — comunque lo si sfumasse — lasciava una macchia sopra la
   prima riga. Il titolo dice dove sei quando arrivi; poi lascia il posto
   a quello che sei venuto a leggere. */
.testata{position:relative;z-index:var(--z-corpo);
  padding:48px 38px 26px;
  transition:padding .3s var(--e-std)}

.testata h1{font-weight:700;font-size:clamp(27px,2.5vw,35px);
  letter-spacing:var(--tr-l);text-transform:lowercase;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:font-size .3s var(--e-std)}
.testata .s{color:var(--gri-3);font-size:15px;margin:6px 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity .26s var(--e-std),max-height .3s var(--e-std)}

/* Titolo e sottotitolo sulla stessa riga, centrati come un unico blocco.
   Tre colonne: una vuota a sinistra per bilanciare le azioni a destra
   (stessa larghezza, --lato-w), il titolo in mezzo. Così il centro è
   davvero il centro della testata, non della sola metà libera. */
/* 1fr auto 1fr: le due colonne esterne si tengono sempre della stessa
   larghezza (è la definizione di fr), quella del titolo si stringe al suo
   contenuto e resta in mezzo. Nessun calcolo JS della larghezza. */
/* Il titolo sta a sinistra come tutto quello che c'è sotto: centrato
   in mezzo alla finestra si staccava dal contenuto, e il sottotitolo
   appiccicato di fianco sembrava una didascalia messa lì per riempire.
   Adesso è una cosa sola: nome della schermata, e sotto cosa contiene. */
.testata .fila{display:flex;align-items:center;gap:18px}
.testata-destra{display:flex;align-items:center;justify-content:flex-end;
  gap:10px;min-width:0;flex:none}
.testata .crescita{flex:1;min-width:0}
.vista{padding:38px;flex:1;max-width:1240px;width:100%}
.tabbar{display:none}

/* ------------------------------------------------------------
   TABLET · il fianco parte già a icone
   ------------------------------------------------------------ */


/* ------------------------------------------------------------
   TELEFONO · il dock
   Cinque icone che galleggiano sopra il contenuto. La pastiglia
   dell'accento scivola da una all'altra: è un solo oggetto che si
   sposta, non cinque stati che si accendono.
   ------------------------------------------------------------ */


/* schermi molto stretti: il dock resta a cinque, si stringe soltanto */




/* ============================================================
   PEZZI DELL'APP
   ============================================================ */
.griglia-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.griglia-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.tremezzo{display:grid;grid-template-columns:1.35fr .65fr;gap:20px;align-items:start}
.sez-t{display:flex;align-items:baseline;gap:13px;margin:46px 0 18px}
.sez-t h2{font-weight:600;font-size:19px;letter-spacing:var(--tr-l);text-transform:lowercase}
.sez-t .l{flex:1;height:1px;background:var(--bo)}
.sez-t:first-child{margin-top:0}

.dato .k{color:var(--gri);font-size:13.5px}
.dato .v{margin-top:12px;font-weight:700;
  font-size:clamp(28px,3vw,38px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.dato .d{color:var(--gri-3);font-size:13px;margin-top:10px}
.dato .v.acc{color:var(--acc)}

/* ------------------------------------------------------------
   IL CASSETTO — quello che c'è ma non chiede niente
   Sta chiuso di suo: se lo aprissimo noi, ogni volta che entri in
   Collaborazioni la prima cosa che vedi sarebbe una lista di attese.
   ------------------------------------------------------------ */
.cassetto{margin-top:26px;border-radius:var(--r-3);background:var(--su-1);
  border:1px solid var(--bo);box-shadow:var(--filo);overflow:hidden;
  transition:border-color var(--t-tocco) var(--e-std)}
.cassetto.aperto{border-color:var(--bo-2)}
.cassetto-t{display:flex;align-items:center;gap:14px;width:100%;padding:17px 20px;
  text-align:left;font-size:15px;font-weight:600;color:var(--gri-2);min-height:56px;
  transition:color var(--t-tocco) var(--e-std),background-color var(--t-tocco) var(--e-std)}
.cassetto-t:hover{color:var(--bia);background:var(--velo)}
.cassetto-t .freccia{display:grid;place-items:center;color:var(--gri-3);flex:none;
  transition:transform .32s var(--e-molla),color var(--t-tocco) var(--e-std)}
.cassetto.aperto .cassetto-t{color:var(--bia)}
.cassetto.aperto .freccia{transform:rotate(90deg);color:var(--acc)}
.cassetto-t .quante{flex:none;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
  min-width:24px;height:24px;padding:0 8px;border-radius:var(--r-p);display:grid;place-items:center;
  background:var(--velo);color:var(--gri);box-shadow:inset 0 0 0 1px var(--bo)}
.cassetto.aperto .cassetto-t .quante{background:rgba(var(--acc-rgb),.15);color:var(--acc);box-shadow:none}
.cassetto-c{padding:4px 20px 20px;animation:vista-entra .3s var(--e-std) both}

/* una proposta in attesa non è una collaborazione: non si solleva al
   passaggio e non ha l'accento acceso — non c'è niente da fare */
.collab.in-attesa{margin-bottom:12px;background:var(--su-2);box-shadow:var(--filo)}
.collab.in-attesa:hover{transform:none;border-color:var(--bo-2);box-shadow:var(--filo)}
.collab.in-attesa .fondo{display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap}
@media (max-width:560px){
  .cassetto-t{padding:15px 16px;font-size:14.5px;gap:11px}
  .cassetto-c{padding:2px 16px 16px}
  .collab.in-attesa .fondo{gap:8px}
}

.collab{display:block;width:100%;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018)),var(--su-1);
  border:1px solid var(--bo);border-radius:var(--r-3);
  padding:24px 26px;margin-bottom:calc(var(--aperto) + 14px);
  box-shadow:var(--om-2), var(--filo);position:relative;overflow:hidden;
  transition:background-color var(--t-tocco) var(--e-std),border-color var(--t-tocco) var(--e-std),
             transform .24s var(--e-molla),box-shadow .24s var(--e-std)}
.collab::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 100% at 100% 0%, rgba(var(--acc-rgb),.07), transparent 62%)}
.collab:hover{border-color:var(--bo-2);transform:translateY(-2px);box-shadow:var(--om-3), var(--filo)}
.collab:active{transform:scale(.985)}
.collab .cap{display:flex;align-items:flex-start;gap:16px;position:relative}
.collab .ti{display:block;font-weight:600;font-size:16.5px;line-height:1.3}
.collab .me{display:block;color:var(--gri);font-size:14px;margin-top:5px}
.collab .soldi{text-align:right;flex:none}
.collab .imp{display:block;font-weight:700;font-size:26px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.collab .soldi .sotto{display:block;color:var(--gri-3);font-size:12.5px;margin-top:4px;white-space:nowrap}
.collab .fondo{display:flex;align-items:center;gap:22px;margin-top:22px;flex-wrap:wrap;position:relative}
.collab .percorso{flex:1;min-width:150px;max-width:280px}
.scheda .percorso{max-width:460px}

.conta-sez{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--acc);
  color:var(--su-acc);border-radius:var(--r-p);padding:3px 10px;line-height:1.5;flex:none}
.conta-sez.spenta{background:var(--velo);color:var(--gri);box-shadow:inset 0 0 0 1px var(--bo)}

.compiti{display:flex;flex-direction:column;gap:14px}
.compito{display:flex;align-items:flex-start;gap:18px;border-radius:var(--r-3);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018)),var(--su-1);
  border:1px solid var(--bo);border-left:2px solid var(--acc);padding:24px 26px;
  box-shadow:var(--om-2), var(--filo)}
.compito.allerta{border-left-color:var(--male)}
.compito .cod{display:block;font-size:12px;color:var(--gri-3);margin-bottom:8px;letter-spacing:.02em}
.compito .cod.id{color:var(--contro);font-weight:600}
.compito h3{font-weight:600;font-size:17.5px;letter-spacing:var(--tr-l);
  text-transform:lowercase;line-height:1.3}
.compito p{color:var(--gri);font-size:14.5px;margin-top:9px;max-width:62ch;line-height:1.6}
.compito .mossa{flex:none;align-self:center}

.adesso{display:flex;align-items:center;gap:18px;margin-top:calc(var(--aperto) + 20px);
  border-radius:var(--r-3);background:var(--su-1);border:1px solid var(--bo);padding:24px 26px;
  box-shadow:var(--om-2), var(--filo)}
.adesso.mio{border-color:rgba(var(--acc-rgb),.34);
  background:linear-gradient(180deg,rgba(var(--acc-rgb),.08),rgba(var(--acc-rgb),.03)),var(--su-1)}
.adesso h3{font-weight:600;font-size:18px;letter-spacing:var(--tr-l);text-transform:lowercase}
.adesso p{color:var(--gri);font-size:14.5px;margin-top:7px;max-width:62ch}
.adesso .mossa{flex:none}

.spina{position:relative;padding-left:32px}
.spina::before{content:"";position:absolute;left:8px;top:16px;bottom:16px;width:1px;background:var(--bo-2)}
.spina .nodo{position:relative;padding:14px 0}
.spina .nodo::before{content:"";position:absolute;left:-28px;top:20px;width:9px;height:9px;
  border-radius:50%;background:var(--fondo);box-shadow:inset 0 0 0 1.5px var(--bo-2);
  transition:background-color .5s var(--e-std),box-shadow .5s var(--e-molla)}
.spina .nodo.fatto::before{background:var(--acc);box-shadow:0 0 10px rgba(var(--acc-rgb),.34)}
.spina .nodo.ora::before{background:var(--fondo);box-shadow:inset 0 0 0 2.5px var(--acc)}
.spina .nodo .t{font-size:15px;font-weight:600}
.spina .nodo.futuro .t{color:var(--gri-3);font-weight:450}
.spina .nodo .d{color:var(--gri);font-size:13px;margin-top:3px}

.rilascio{border-radius:var(--r-3);padding:30px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018)),var(--su-1);
  border:1px solid var(--bo);box-shadow:var(--om-2), var(--filo)}
.rilascio .presa{width:118px;margin:0 auto;touch-action:none;cursor:grab;user-select:none;
  -webkit-user-select:none;border-radius:50%;transition:filter .28s var(--e-std)}
.rilascio .presa.tenuta{filter:drop-shadow(0 16px 40px rgba(var(--cre-rgb),.28))}
.rilascio .presa:active{cursor:grabbing}
.rilascio .presa .mon{width:100%}
.rilascio .eti{margin-top:20px;color:var(--gri);font-size:14.5px;transition:color .3s var(--e-std)}
.rilascio .eti.fatto{color:var(--acc);font-weight:600}

.consegna{display:flex;align-items:flex-start;gap:14px;padding:16px 0;
  border-bottom:1px solid rgba(255,255,255,.045)}
.consegna:last-child{border-bottom:0}
.consegna .box{width:19px;height:19px;flex:none;margin-top:2px;border-radius:6px;
  box-shadow:inset 0 0 0 1.5px var(--bo-2);display:grid;place-items:center;font-size:10px;color:var(--su-acc);
  transition:background-color .34s var(--e-std),box-shadow .34s var(--e-molla),transform .34s var(--e-molla)}
.consegna.ok .box{background:var(--acc);box-shadow:0 0 10px rgba(var(--acc-rgb),.3)}
.consegna .t{font-size:15px}
.consegna .d{color:var(--gri);font-size:13px;margin-top:3px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}

.trovato{border-radius:var(--r-3);padding:24px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018)),var(--su-1);
  border:1px solid var(--bo);box-shadow:var(--om-2), var(--filo);
  transition:border-color var(--t-tocco) var(--e-std),transform .24s var(--e-molla),box-shadow .24s var(--e-std)}
.trovato:hover{border-color:var(--bo-2);transform:translateY(-2px);box-shadow:var(--om-3), var(--filo)}
.trovato:active{transform:scale(.99)}
.trovato .cap{display:flex;gap:14px;align-items:center}
.trovato .n{font-weight:600;font-size:15.5px;line-height:1.25}
.trovato .h{color:var(--gri-3);font-size:13.5px}
.trovato .num{margin-top:18px;padding-top:16px;border-top:1px solid var(--bo)}
.trovato .coda{margin-top:auto;padding-top:18px}
.trovato .tab-r{align-items:baseline;flex-wrap:wrap;row-gap:2px}
.trovato .tab-r .k{overflow:visible;text-overflow:clip;flex:none}
.trovato .tab-r .n{white-space:normal;text-align:right;min-width:0}
/* Chi non cerca resta visibile ma si spegne: l'elenco deve dire
   la verità, non far perdere tempo. Non si nasconde — nasconderlo
   toglierebbe all'azienda l'informazione che quel creator esiste. */
.trovato.spento{opacity:.55;background:var(--su-1)}
.trovato.spento:hover{opacity:.78;transform:none;box-shadow:var(--om-2), var(--filo)}
.trovato.spento .ava{filter:saturate(.35)}
.fuori-cerca{margin-top:12px;font-size:12.5px;line-height:1.4;color:var(--gri-3);
  padding:8px 11px;border-radius:var(--r-1);background:var(--velo);
  box-shadow:inset 0 0 0 1px var(--bo);text-align:left}

/* le righe dello storico dichiarato: presenti, ma spente */
.storia-riga.velata{opacity:.72}
.storia-riga.velata .chi{color:var(--gri-2)}

/* i filtri su mobile scorrono in orizzontale: è l'unico scroll
   laterale ammesso, ed è deliberato */
.filtri{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.filtro{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:13.5px;font-weight:500;color:var(--gri-2);background:var(--velo);
  box-shadow:inset 0 0 0 1px var(--bo);border-radius:var(--r-p);padding:9px 16px;min-height:38px;
  white-space:nowrap;
  transition:color var(--t-tocco) var(--e-std),background-color var(--t-tocco) var(--e-std),
             box-shadow var(--t-tocco) var(--e-std),transform var(--t-tocco) var(--e-molla)}
.filtro:hover{color:var(--bia);background:var(--velo-2)}
.filtro:active{transform:scale(.94)}
.filtro[aria-pressed="true"]{color:var(--su-acc);font-weight:600;background:var(--acc);box-shadow:none}


.isto{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:24px}
.isto .b{flex:1;background:linear-gradient(180deg,var(--acc),rgba(var(--acc-rgb),.14));
  border-radius:4px 4px 0 0;min-height:3px;transition:height .9s var(--e-std)}

.avviso{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px) scale(.96);z-index:var(--z-avviso);
  background:rgba(255,255,255,.96);color:#08090A;padding:14px 24px;border-radius:var(--r-p);
  font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;max-width:calc(100vw - 32px);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:opacity .3s var(--e-std),transform .44s var(--e-molla);
  box-shadow:0 20px 52px rgba(0,0,0,.6)}
.avviso.qui{opacity:1;transform:translate(-50%,0) scale(1)}


.vuoto{text-align:center;padding:64px 20px;color:var(--gri)}
.vuoto .mon{width:44px;margin:0 auto 20px;display:block}

/* il ritratto in alto vive solo su telefono: sul desktop il profilo
   sta in fondo al fianco, dove c'è spazio per il nome per intero */
.io{display:none}

/* le voci dentro il pannello */
.menu-foglio{display:flex;flex-direction:column;gap:2px}
.menu-foglio button,.menu-foglio a{display:flex;align-items:center;gap:14px;width:100%;
  padding:14px 12px;border-radius:var(--r-2);font-size:15.5px;color:var(--gri-2);text-align:left;
  min-height:52px;transition:color var(--t-tocco) var(--e-std),background-color var(--t-tocco) var(--e-std)}
.menu-foglio button:hover,.menu-foglio a:hover{color:var(--bia);background:var(--velo)}
.menu-foglio .ico{color:var(--gri-3);flex:none}


/* ============================================================
   LA FASCIA FINANZIARIA
   I numeri non sono schede. Stanno affiancati dentro una sola
   superficie, separati da una linea: si leggono come un estratto
   conto, non come tre oggetti indipendenti dello stesso peso.
   ============================================================ */
.fascia{display:grid;grid-template-columns:1.25fr 1fr 1fr;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012)),var(--su-1);
  border:1px solid var(--bo);border-radius:var(--r-3);box-shadow:var(--filo);overflow:hidden}
.voce{padding:22px 24px;position:relative;min-width:0}
.voce + .voce::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:1px;background:var(--bo)}
.voce .k{display:flex;align-items:center;gap:9px;color:var(--gri);font-size:13.5px;min-width:0}
.voce .k svg{width:16px;height:16px;flex:none;color:var(--gri-3)}
.voce .k span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voce .v{margin-top:12px;font-weight:700;font-size:clamp(25px,2.6vw,33px);letter-spacing:-.04em;
  line-height:1;font-variant-numeric:tabular-nums}
.voce .d{color:var(--gri-3);font-size:12.5px;margin-top:9px}
/* la voce che conta è più larga, ha l'accento e una luce sua:
   la gerarchia si vede prima di leggere */
.voce.forte{background:radial-gradient(120% 130% at 0% 0%, rgba(var(--acc-rgb),.09), transparent 62%)}
.voce.forte .k svg{color:var(--acc)}
.voce.forte .v{font-size:clamp(30px,3.4vw,42px)}

/* la tabella-registro: intestazione più discreta */
.reg-t td.segno{width:30px}


/* intestazione del flusso: esiste solo su telefono */
.passo-mobile{display:none}
.piede-flusso{display:flex;align-items:center;justify-content:space-between;gap:14px}
.piede-flusso .mosse{display:flex;gap:8px}


/* --- l'avviso: un punto d'accento davanti, entrata con molla --- */
.avviso{display:flex;align-items:center;gap:11px;text-align:left}
.avviso .segno{width:8px;height:8px;border-radius:50%;flex:none;
  background:linear-gradient(90deg,var(--cre) 50%,var(--bra) 50%)}

/* --- il rilascio: quando le due metà combaciano il riquadro si accende
       un istante, poi torna. È il momento in cui il denaro è arrivato. --- */
@keyframes accendi{0%{box-shadow:var(--om-2),var(--filo)}
  35%{box-shadow:0 0 0 1px rgba(var(--acc-rgb),.5), 0 0 46px rgba(var(--acc-rgb),.26), var(--filo)}
  100%{box-shadow:var(--om-2),var(--filo)}}
.rilascio:has(.presa.chiuso){animation:accendi 1.1s var(--e-std) both}
.presa.chiuso{filter:drop-shadow(0 10px 34px rgba(var(--acc-rgb),.4))}

/* --- il bottone principale: un velo di luce lo attraversa al passaggio --- */
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 66%);
  transform:translateX(-120%);transition:transform .7s var(--e-std)}
@media (hover:hover){ .btn:hover::after{transform:translateX(120%)} }
.btn.ghost::after,.btn.nero::after{display:none}

/* --- la spunta di una consegna scatta invece di accendersi --- */
@keyframes spunta{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.consegna.ok .box{animation:spunta .42s var(--e-molla) both}

/* --- le pastiglie di stato entrano con un soffio --- */
@keyframes pil-in{from{opacity:0;transform:translateY(-3px) scale(.94)}to{opacity:1;transform:none}}
.vista-nuova .pil,.vista-nuova .turno{animation:pil-in .34s var(--e-molla) both}

/* --- il pannello del ritratto: le voci arrivano una dopo l'altra --- */
.foglio.qui .menu-foglio > *{animation:vista-entra .34s var(--e-std) both}
.foglio.qui .menu-foglio > *:nth-child(2){animation-delay:.05s}
.foglio.qui .menu-foglio > *:nth-child(3){animation-delay:.1s}

/* --- il fianco che si apre: le etichette arrivano dopo la larghezza --- */
.menu .et,.chi .testo,.prima-azione .et,.marchio .coda{transition-delay:.06s}
body[data-fianco="chiuso"] .menu .et,
body[data-fianco="chiuso"] .chi .testo,
body[data-fianco="chiuso"] .prima-azione .et,
body[data-fianco="chiuso"] .marchio .coda{transition-delay:0s}

/* ============================================================
   ADATTAMENTI — stanno in fondo di proposito: prima si definisce
   il componente, poi come cambia. Altrimenti la cascata li perde.
   ============================================================ */

@media (max-width:1080px){ .tremezzo{grid-template-columns:1fr} }

/* --- TABLET: il fianco parte a icone --- */
@media (max-width:1180px) and (min-width:861px){
  .tela{grid-template-columns:var(--fianco-min) 1fr}
  body[data-fianco="aperto"] .tela{grid-template-columns:var(--fianco) 1fr}
  .testata{padding:40px 26px 22px}
  .vista{padding:26px}
}

/* ============================================================
   TELEFONO
   ============================================================ */
@media (max-width:860px){
  /* il fianco diventa dock flottante ed esce dal flusso: la tela torna
     a una colonna sola. Specificità pari a quella della regola desktop,
     altrimenti quella vince e il contenuto resta largo 76 px. */
  body[data-fianco] .tela{grid-template-columns:1fr}

  /* --- IL DOCK --- */
  .fianco{
    position:fixed;left:var(--dock-gap);right:var(--dock-gap);
    bottom:calc(var(--dock-gap) + var(--safe-b));top:auto;
    width:auto;height:var(--dock-h);padding:0;gap:0;
    flex-direction:row;align-items:stretch;
    background:rgba(16,19,20,.78);
    border:1px solid rgba(255,255,255,.09);border-radius:24px;
    box-shadow:0 18px 44px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4),
               inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    overflow:visible;transform:translate3d(0,0,0);
    transition:transform .42s var(--e-std),opacity .3s var(--e-std);
  }
  body.dock-via .fianco{transform:translate3d(0,calc(100% + var(--dock-gap) + var(--safe-b)),0);opacity:0}
    /* Sul telefono il fianco è un dock di cinque icone: tutto ciò che
     non è una voce di menu esce di scena. Il segnale di ricerca resta
     raggiungibile dal pannello del ritratto, in alto a destra. */
  .fianco .alto,.fianco .chi,.fianco .prima-azione,.fianco #cerca{display:none}

  /* Le regole del fianco chiuso hanno la stessa forma (body[data-fianco…])
     e quindi vincono anche qui, dove il fianco non è una colonna ma un
     dock: rimettevano 18px di imbottitura e pulsanti da 48px dentro una
     barra alta 66. È da lì che le icone risultavano più in basso del
     dock. Si riscrivono con la stessa specificità, e stando dopo vincono. */
  body[data-fianco] .fianco{padding:0}
  body[data-fianco] .menu{width:auto;margin:0;padding:0 6px}
  body[data-fianco] .menu button{width:auto;height:100%;min-height:0;margin:0}
  body[data-fianco] .menu .cont{top:9px;right:auto}

  /* altezza esplicita: dentro un contenitore fisso il 100% non risolve
     e la pastiglia si schiaccerebbe */
  .menu{flex-direction:row;flex:1;height:calc(var(--dock-h) - 2px);
    margin:0;gap:0;padding:0 6px;align-items:stretch}
  .menu .solo-largo{display:none}
  .menu button{flex:1;padding:0;height:100%;min-height:0;min-width:0;
    display:grid;place-items:center;border-radius:18px;background:none!important;
    box-shadow:none!important;color:var(--gri-3);position:relative;line-height:0}
  .menu button .et,.menu button .sugg{display:none}
  .menu .ic{position:relative;z-index:2;
    transition:transform .46s var(--e-molla),color .28s var(--e-std)}
  .menu .ic .ico{width:23px;height:23px}
  .menu button[aria-current="page"]{color:var(--bia)}
  /* niente translateY: spostare su di 1 px la sola icona attiva è
     esattamente ciò che faceva sembrare la fila storta */
  .menu button[aria-current="page"] .ic{color:var(--bia);transform:scale(1.04)}
  .menu button[aria-current="page"]::before{display:none}
  .menu button:active .ic{transform:scale(.8)}
  .menu .cont{position:absolute;top:7px;left:calc(50% + 4px);margin:0;
    min-width:18px;height:18px;display:grid;place-items:center;
    font-size:12px;padding:0 5px;line-height:1;z-index:3;
    box-shadow:0 0 0 2px rgba(16,19,20,.95)}
  .menu button[aria-current="page"] .cont{background:var(--acc);color:var(--su-acc);
    box-shadow:0 0 0 2px rgba(16,19,20,.95)}

  /* la pastiglia: un solo oggetto che scivola fra le posizioni */
  /* height:auto è necessario: la regola del fianco imposta un'altezza
     fissa, e con top, bottom e height insieme vince height — la
     pastiglia del dock resterebbe alta 44px invece di riempirlo. */
  /* Stessa idea, in orizzontale. height:auto perché la regola del fianco
     ne fissa una, e con top, bottom e height insieme vincerebbe height. */
  .menu::before{content:"";position:absolute;top:8px;bottom:8px;height:auto;z-index:1;
    width:var(--pill-w,52px);left:0;right:auto;border-radius:17px;
    background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.045));
    box-shadow:0 6px 16px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.14),
               inset 0 0 0 1px rgba(255,255,255,.06);
    transform:translate3d(var(--pill-x,0px),0,0);
    transition:transform .5s var(--e-molla),width .42s var(--e-std),background-image .3s var(--e-std);
    opacity:var(--pill-o,0);pointer-events:none}

  /* --- TESTATA che si ritira scorrendo ---
     Su telefono il titolo centrato non serve: torna il layout compatto,
     a sinistra, con l'avatar a destra e il resto nascosto. */
  .testata{padding:30px 18px 16px}
  .testata .fila{gap:12px}
  .testata h1{font-size:26px}
  .testata .s{font-size:14px;margin-top:4px}
  .io{display:grid}
  #azioniTestata{display:none}

  .vista{padding:20px 18px calc(var(--pollice) + 24px)}

  /* --- TITOLO DI SEZIONE: non va mai a capo --- */
  .sez-t{margin:32px 0 14px;gap:10px}
  .sez-t h2{white-space:nowrap;font-size:17.5px}
  .sez-t .l{min-width:12px}

  /* --- COMPITO e ADESSO: griglia esplicita, niente wrap a caso.
         L'icona e il titolo stanno sulla stessa riga, il testo sotto
         a tutta larghezza, l'azione in fondo e piena. --- */
  .compito,.adesso{display:grid;grid-template-columns:auto 1fr;gap:0 14px;
    align-items:center;padding:20px}
  .compito .bollo,.adesso .bollo{grid-column:1;grid-row:1;width:40px;height:40px}
  .compito .crescita,.adesso .crescita{grid-column:2;grid-row:1;min-width:0}
  .compito > div:not(.mossa):not(.crescita),
  .adesso > div:not(.mossa):not(.crescita){grid-column:1 / -1;min-width:0}
  .compito .mossa,.adesso .mossa{grid-column:1 / -1;width:100%;margin-top:18px;align-self:stretch}
  .compito .mossa .btn,.adesso .mossa .btn{width:100%}
  .compito h3,.adesso h3{font-size:17px}
  .compito p,.adesso p{font-size:14.5px;margin-top:8px}

  /* --- COLLABORAZIONE: l'importo è la prima cosa, poi lo stato --- */
  .collab{padding:20px;border-radius:var(--r-3)}
  .collab .cap{flex-wrap:wrap;gap:4px 16px}
  .collab .ti{font-size:16px}
  .collab .soldi{text-align:left;width:100%;order:-1;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .collab .imp{font-size:29px}
  .collab .soldi .sotto{margin:0}
  .collab .fondo{gap:12px 16px;margin-top:18px}
  .collab .percorso{max-width:none;min-width:120px}


  /* --- LA FASCIA su telefono: si impila, ma il numero forte resta
         primo e più grande. Non tre card uguali. --- */
  .fascia{grid-template-columns:1fr;border-radius:var(--r-2)}
  .voce{padding:18px 20px;display:grid;grid-template-columns:1fr auto;
    align-items:baseline;gap:2px 16px}
  .voce .k{grid-column:1;grid-row:1}
  .voce .v{grid-column:2;grid-row:1;margin:0;font-size:23px;text-align:right}
  .voce .d{grid-column:1 / -1;grid-row:2;margin-top:4px}
  .voce + .voce::before{left:20px;right:20px;top:0;bottom:auto;width:auto;height:1px}
  /* la voce principale tiene il formato grande: è il motivo per cui
     hai aperto l'app */
  .voce.forte{display:block;padding:22px 20px}
  .voce.forte .v{font-size:36px;margin-top:10px;text-align:left}
  .voce.forte .d{margin-top:8px}


  /* --- IL FLUSSO DELLA PROPOSTA ---
     Una fase per schermata. Al posto della colonna dei passi, una riga
     sola che dice dove sei e quanto manca; l'azione è piena e in fondo. */
  body.flusso .fianco{transform:translate3d(0,140%,0);opacity:0;pointer-events:none}
  body.flusso .vista{padding-bottom:120px}
  .modulo-lungo{grid-template-columns:1fr;gap:0}
  .passi-lato{display:none}
  .passo-mobile{display:block;position:sticky;top:0;z-index:10;
    margin:-20px -18px 18px;padding:14px 18px 16px;
    background:rgba(8,9,10,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--bo)}
  .passo-mobile .ora{font-weight:600;font-size:14.5px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .passo-mobile .barra{height:4px}

  /* le consegne successive tengono le etichette: qui i campi sono
     impilati e senza etichetta non si capisce cosa si sta scrivendo */
  .riga-consegna.senza-etichette .etichetta{display:block}
  .riga-consegna{gap:14px;padding:18px;border:1px solid var(--bo);
    border-radius:var(--r-2);background:var(--su-2)}
  .riga-consegna + .riga-consegna{margin-top:12px}
  .riga-consegna .togli{position:absolute;top:10px;right:10px;justify-self:end}
  .riga-consegna{position:relative}

  /* il piede: avanti a tutta larghezza, indietro come testo */
  .piede-flusso{flex-wrap:wrap;gap:10px;
    padding:14px 18px calc(14px + var(--safe-b));margin:0 -18px;
    bottom:0}
  .piede-flusso .quanti{display:none}
  .piede-flusso .mosse{width:100%;gap:10px;align-items:center}
  .piede-flusso .avanti{flex:1;min-height:52px;font-size:16px}
  .piede-flusso .indietro{background:none;box-shadow:none;color:var(--gri);
    padding:0 6px;min-height:52px;backdrop-filter:none}

  /* --- il resto --- */
  .griglia-3,.griglia-2{gap:12px}
  .isto{height:104px;gap:3px}
  .rilascio{padding:24px 20px}
  .rilascio .presa{width:104px}
  .blocco{padding:20px}
  .riepilogo{bottom:var(--pollice);padding:14px 0}
  .spina{padding-left:28px}
  .storia-riga{grid-template-columns:1fr auto;gap:6px 14px}
  .storia-riga .quando{grid-column:1 / -1;order:-1}
  .avviso{bottom:calc(var(--pollice) + 12px)}
  .trovato{padding:20px}

  .filtri{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    margin:0 -18px;padding:2px 18px 6px}
  .filtri::-webkit-scrollbar{display:none}
  .filtro{flex:none;scroll-snap-align:start}
}

/* --- schermi molto stretti --- */
@media (max-width:359px){
  .fianco{left:8px;right:8px;bottom:calc(8px + var(--safe-b))}
  .menu .ic .ico{width:21px;height:21px}
  .vista{padding:16px 14px calc(var(--pollice) + 20px)}
  .testata{padding:24px 14px 14px}
  .testata h1{font-size:23px}
  .compito,.adesso,.collab,.blocco,.trovato{padding:17px}
  .collab .imp{font-size:26px}
}
</style>
</head>
