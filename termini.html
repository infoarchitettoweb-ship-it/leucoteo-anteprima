<script type="module">
import { MONETA_SVG } from './assets/moto.js?v=20260902-1555';
import { ICO } from './assets/segni.js?v=20260902-1555';
document.getElementById('marchio').innerHTML = MONETA_SVG;

const si = t => `<li class="si">${ICO.fatto()}<span>${t}</span></li>`;
const no = t => `<li class="no">${ICO.scartato()}<span>${t}</span></li>`;

document.getElementById('testo').innerHTML = `
<div class="testo">
  <h1>cosa si vede<br>e cosa no</h1>
  <p class="occhiello">Leucoteo mette in mano a un'azienda lo storico verificato di un creator.
    È il cuore del prodotto, ed è anche la parte che tocca dati di persone e di imprese.
    Qui c'è scritto esattamente cosa è visibile, a chi, e perché è lecito.</p>

  <h2>la regola in una riga</h2>
  <p>I dati di un creator sono suoi e li pubblica lui. I dati di un'azienda sono suoi e
    non li pubblica nessun altro. Dove i due si incrociano, serve il consenso di entrambi —
    e in mancanza, si mostra il meno possibile.</p>

  <h2>di un creator, un'azienda vede</h2>
  <ul>
    ${si('Numero di collaborazioni concluse, e in che mesi')}
    ${si('Formati consegnati: reel, storie, post, video')}
    ${si('Se ha consegnato nei tempi concordati, e con quanto scarto')}
    ${si('Il giudizio medio ricevuto dalle aziende, e le note lasciate')}
    ${si('Il settore merceologico delle aziende con cui ha lavorato')}
    ${si('Il totale aggregato di persone portate sui siti, su tutte le aziende insieme')}
    ${si('Metriche pubbliche dei suoi profili social, lette dalle API ufficiali')}
  </ul>
  <p>Sono tutti dati che riguardano il creator. Il creator li rende visibili con un consenso
    esplicito, revocabile in ogni momento dal suo profilo. Revocandolo, la scheda torna privata
    e le aziende vedono solo quello che lui pubblica di sua iniziativa.</p>

  <h2>di un'azienda, un'altra azienda non vede</h2>
  <ul>
    ${no('Il nome dell’azienda, se quella azienda non ha dato il consenso')}
    ${no('Quanto ha fatturato una singola collaborazione')}
    ${no('Il compenso pattuito con quel creator')}
    ${no('I prodotti, i codici sconto o i margini')}
    ${no('Qualunque dato dei clienti finali')}
  </ul>
  <p>Al posto del nome compare il settore: «un'azienda di skincare», «un'azienda di caffè».
    Un'azienda può scegliere di farsi nominare — di solito conviene, perché vale come referenza —
    ma è una scelta sua, spenta di partenza.</p>

  <h2>chi vede cosa</h2>
  <table class="tavola tab-schede">
    <thead><tr><th>Dato</th><th>Il creator</th><th>L’azienda coinvolta</th><th>Altre aziende</th></tr></thead>
    <tbody>
      <tr><td class="primo">Compenso pattuito</td><td data-k="Il creator">sì</td><td data-k="L’azienda">sì</td><td data-k="Altre aziende">no</td></tr>
      <tr><td class="primo">Clic sul link di quella collaborazione</td><td data-k="Il creator">sì</td><td data-k="L’azienda">sì</td><td data-k="Altre aziende">no</td></tr>
      <tr><td class="primo">Persone portate, totale aggregato del creator</td><td data-k="Il creator">sì</td><td data-k="L’azienda">sì</td><td data-k="Altre aziende">sì</td></tr>
      <tr><td class="primo">Contatti diretti (email, telefono)</td><td data-k="Il creator">sì</td><td data-k="L’azienda">solo ad accordo firmato</td><td data-k="Altre aziende">no</td></tr>
      <tr><td class="primo">Collaborazioni dichiarate, non verificate</td><td data-k="Il creator">sì</td><td data-k="L’azienda">sì, marcate come tali</td><td data-k="Altre aziende">sì, marcate come tali</td></tr>
      <tr><td class="primo">Nome dell’azienda</td><td data-k="Il creator">sì</td><td data-k="L’azienda">sì</td><td data-k="Altre aziende">solo col consenso</td></tr>
      <tr><td class="primo">Puntualità nelle consegne</td><td data-k="Il creator">sì</td><td data-k="L’azienda">sì</td><td data-k="Altre aziende">sì</td></tr>
      <tr><td class="primo">Giudizio e nota lasciati</td><td data-k="Il creator">sì</td><td data-k="L’azienda">sì</td><td data-k="Altre aziende">sì</td></tr>
      <tr><td class="primo">Coordinate bancarie del creator</td><td data-k="Il creator">sì</td><td data-k="L’azienda">solo a lavoro approvato</td><td data-k="Altre aziende">no</td></tr>
      <tr><td class="primo">Dati dei clienti finali</td><td data-k="Il creator">no</td><td data-k="L’azienda">sul proprio sito, non qui</td><td data-k="Altre aziende">no</td></tr>
    </tbody>
  </table>

  <h2>le coordinate bancarie</h2>
  <p>Dentro Leucoteo non passa denaro. L'azienda paga con un bonifico ordinario, e per farlo ha
    bisogno dell'IBAN del creator: viene mostrato solo dopo che il lavoro è stato approvato,
    solo all'azienda di quella collaborazione, e non compare mai in nessuna ricerca o scheda pubblica.</p>
  <p>Un IBAN è un dato personale comune: si può trattare per eseguire un contratto di cui
    l'interessato è parte. Va però conservato cifrato, mostrato solo a chi deve pagare e
    cancellato quando il rapporto finisce.</p>
  <p>Leucoteo non chiede il codice fiscale e non calcola imposte: niente ritenuta d'acconto,
    niente marca da bollo, nessuna trattenuta. Il documento fiscale e il regime con cui il
    compenso viene dichiarato restano una faccenda fra azienda e creator.</p>

  <h2>quello che leucoteo non promette</h2>
  <p>L'accettazione dei termini con data, ora, indirizzo IP e conferma via codice è una firma
    elettronica semplice: è valida, ma la sua efficacia in giudizio la valuta liberamente un
    giudice. Leucoteo non è parte del contratto fra azienda e creator e non può farlo rispettare.
    La tutela che offre è pratica, non giudiziaria: un accordo scritto, consegne datate,
    un pagamento tracciato e una reputazione che vale per entrambi.</p>

  <h2>nota</h2>
  <p>Questo testo descrive come è progettato il prodotto. Non è un'informativa privacy né un
    contratto: prima di andare in produzione va scritto da un legale, insieme all'informativa
    ai sensi dell'art. 13 GDPR, all'accordo di nomina a responsabile con ogni azienda e al
    contratto tipo fra le parti.</p>

  <div class="piede">Ultimo aggiornamento: agosto 2026 · <a href="index.html" style="color:var(--gri-2);text-decoration:underline">torna al sito</a></div>
</div>`;
